spring.application.name=module-eureka
server.port=${SERVER_PORT:8761}

# Servidor de registro: no se auto-registra ni descarga el registro de otros
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.server.enable-self-preservation=${EUREKA_SELF_PRESERVATION:true}

# Métricas Prometheus (mismo patrón que el resto de módulos)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
