# Fragmento común para microservicios de negocio (order, transport, inventory, rm, pale, location, biesse)
# Copiar o importar en cada módulo vía spring.config.import si lo prefiere centralizado.

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=true
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
