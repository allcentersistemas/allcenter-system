# Fragmento común para module-system y module-biesse en producción.
# Importar vía spring.config.import si se centraliza la config.

spring.jpa.hibernate.ddl-auto=validate

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=true
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
