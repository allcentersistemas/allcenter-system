spring.datasource.url=jdbc:h2:mem:module_system_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.validate-secrets-on-startup=false
app.rm.storage-root=${java.io.tmpdir}/appscanner-test/rm

jwt.secret=test-jwt-secret-at-least-32-bytes-long-for-hs256
jwt.access-expiration-ms=900000
jwt.refresh-expiration-ms=604800000
