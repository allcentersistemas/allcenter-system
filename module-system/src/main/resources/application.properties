spring.application.name=module-system
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:5174}
app.security.api-auth-enabled=false
app.security.headers-enabled=${APP_SECURITY_HEADERS_ENABLED:true}
app.security.validate-secrets-on-startup=false

app.auth.registration-enabled=${APP_AUTH_REGISTRATION_ENABLED:true}
app.auth.first-setup-enabled=${APP_AUTH_FIRST_SETUP_ENABLED:true}

jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-hs256-algorithm}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.registration.allowed-role-names=${REGISTRATION_ALLOWED_ROLES:USER}
app.first-setup.secret=${FIRST_SETUP_SECRET:}
app.master-user.bootstrap=${MASTER_USER_BOOTSTRAP:false}
app.master-user.email=${MASTER_USER_EMAIL:master@allcenter.local}
app.master-user.password=${MASTER_USER_PASSWORD:changeMeOnFirstDeploy}
app.bootstrap-demo-user=${BOOTSTRAP_DEMO_USER:false}
app.client.demo-user.enabled=${CLIENT_DEMO_USER_BOOTSTRAP:false}
app.client.demo-user.email=${CLIENT_DEMO_USER_EMAIL:demo@client.local}
app.client.demo-user.password=${CLIENT_DEMO_USER_PASSWORD:demo12345}
app.client.demo-user.display-name=${CLIENT_DEMO_USER_DISPLAY_NAME:Cliente demo}

app.biesse.base-url=${APP_BIESSE_BASE_URL:http://localhost:8086}

# SMTP (desactivado por defecto; activar con APP_MAIL_ENABLED=true)
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:noreply@allcenter.local}
app.mail.from-name=${APP_MAIL_FROM_NAME:AllCenter}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# Auth SMTP solo si hay usuario y contraseña (ver MailSenderConfiguration)
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.rm.storage-root=${RM_STORAGE_ROOT:./data/rm}
app.rm.media-dir=${APP_RM_MEDIA_DIR:./var/rm-media}

# Fotos RM desde móvil (varias imágenes de cámara por registro)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:80MB}
spring.servlet.multipart.resolve-lazily=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.level.com.allcenter.modulesystem=INFO
