# Perfil staging: spring.profiles.active=staging
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=false
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

app.auth.registration-enabled=false
app.auth.first-setup-enabled=false

app.bootstrap-demo-user=false

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info,prometheus
