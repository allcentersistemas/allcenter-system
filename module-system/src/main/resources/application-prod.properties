# Perfil producción: spring.profiles.active=prod
server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=false
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

app.auth.registration-enabled=${APP_AUTH_REGISTRATION_ENABLED:false}
app.auth.first-setup-enabled=${APP_AUTH_FIRST_SETUP_ENABLED:false}

app.bootstrap-demo-user=false
app.master-user.bootstrap=${MASTER_USER_BOOTSTRAP:false}
app.master-user.email=${MASTER_USER_EMAIL:}
app.master-user.password=${MASTER_USER_PASSWORD:}

app.biesse.base-url=${APP_BIESSE_BASE_URL:http://module-biesse:8086}

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info
