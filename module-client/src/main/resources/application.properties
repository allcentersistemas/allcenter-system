spring.application.name=module-client
server.port=8084

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
app.security.api-auth-enabled=false
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=false
app.auth.registration-enabled=${APP_AUTH_REGISTRATION_ENABLED:true}

# JWT (en producción use variables de entorno y un secreto fuerte)
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-hs256-algorithm}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Usuario demo (solo desarrollo; desactivado por defecto)
app.client.demo-user.enabled=${CLIENT_DEMO_USER_ENABLED:false}
app.client.demo-user.email=${CLIENT_DEMO_EMAIL:cliente@demo.allcenter.local}
app.client.demo-user.password=${CLIENT_DEMO_PASSWORD:cliente123}
app.client.demo-user.display-name=${CLIENT_DEMO_DISPLAY_NAME:Cliente Demo}
app.client.demo-user.company-name=${CLIENT_DEMO_COMPANY:}
app.client.demo-user.phone=${CLIENT_DEMO_PHONE:}
app.client.demo-user.tax-id=${CLIENT_DEMO_TAX_ID:}

# Eureka & Prometheus
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
