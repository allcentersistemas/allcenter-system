spring.application.name=module-employee
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://181.224.244.102/erp-system
spring.datasource.username=postgres
spring.datasource.password=killme123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT (use a strong secret and env vars in production)
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-hs256-algorithm}
# Access corto; refresh largo (cliente renueva con POST /api/auth/refresh)
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Roles que un usuario puede asignarse en registro (nombres CSV, mayúsculas/minúsculas indistinto)
app.registration.allowed-role-names=${REGISTRATION_ALLOWED_ROLES:USER}

# Primera instalación vía API: POST /api/auth/first-setup (base vacía). Opcional: exigir cabecera X-First-Setup-Secret.
app.first-setup.secret=${FIRST_SETUP_SECRET:}

# Primera instalación alternativa: usuario MASTER al arranque (solo si no hay empleados). No use junto con first-setup si quiere crear la cuenta por API.
app.master-user.bootstrap=${MASTER_USER_BOOTSTRAP:false}
app.master-user.email=${MASTER_USER_EMAIL:master@allcenter.local}
app.master-user.password=${MASTER_USER_PASSWORD:changeMeOnFirstDeploy}

# Opcional: demo ADMIN en BD vacía (dev). Si activa master bootstrap, el master se crea antes y el demo no corre.
app.bootstrap-demo-user=${BOOTSTRAP_DEMO_USER:false}

# API: errores en consola (WARN/ERROR) alineados con el JSON de Postman
logging.level.com.allcenter.moduleemployee.controller.GlobalExceptionHandler=WARN
logging.level.com.allcenter.moduleemployee.config.JwtAuthEntryPoint=WARN

# Eureka & Prometheus
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}