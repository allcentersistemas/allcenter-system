spring.application.name=module-transport
server.port=${SERVER_PORT:8085}

# Base por defecto con tablas de escaneo (ordenes/partes/piezas) y tablas de envíos.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://181.224.244.102:5432/erp-system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:killme123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.com.allcenter.moduletransport=INFO

app.biesse.base-url=${APP_BIESSE_BASE_URL:http://localhost:8086}
app.order.base-url=${APP_ORDER_BASE_URL:http://localhost:8083}

# Eureka & Prometheus
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}