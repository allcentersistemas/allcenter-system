spring.datasource.url=jdbc:h2:mem:module_biesse_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.validate-secrets-on-startup=false
app.security.api-auth-enabled=false

jwt.secret=test-jwt-secret-at-least-32-bytes-long-for-hs256
