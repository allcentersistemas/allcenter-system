server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${BIESSE_JPA_DDL_AUTO:${JPA_DDL_AUTO:update}}

spring.datasource.url=${BIESSE_DATASOURCE_URL}
spring.datasource.username=${BIESSE_DATASOURCE_USERNAME}
spring.datasource.password=${BIESSE_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=true
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

jwt.secret=${JWT_SECRET}

app.system.base-url=${APP_SYSTEM_BASE_URL:http://module-system:8080}
app.biesse.internal-token=${APP_BIESSE_INTERNAL_TOKEN:dev-biesse-internal}
# Cutoff tablero Seguimiento por XML (fechacreacion >=). Override con APP_BIESSE_SEGUIMIENTO_SINCE.
app.biesse.seguimiento-since=${APP_BIESSE_SEGUIMIENTO_SINCE:2026-08-26}

management.endpoints.web.exposure.include=health,info
