spring.application.name=module-biesse
server.port=${SERVER_PORT:8086}

# Base de datos Biesse (obras) — en prod/staging use BIESSE_DATASOURCE_* (ver application-prod.properties)
spring.datasource.url=${BIESSE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/obras}
spring.datasource.username=${BIESSE_DATASOURCE_USERNAME:}
spring.datasource.password=${BIESSE_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=${BIESSE_JPA_DDL_AUTO:${SPRING_JPA_DDL_AUTO:update}}

logging.level.com.allcenter.modulebiesse=INFO

app.auth.me-endpoint=${APP_AUTH_ME_ENDPOINT:http://localhost:8080/api/auth/me}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
app.security.api-auth-enabled=${APP_SECURITY_API_AUTH_ENABLED:false}
app.security.headers-enabled=true
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-256-bits-for-hs256-algorithm}

eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
