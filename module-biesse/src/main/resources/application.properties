spring.application.name=module-biesse
server.port=${SERVER_PORT:8086}

# Base por defecto con tablas legacy de escaneo (ordenes, partes, piezas).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://181.224.244.102:5432/obras}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:killme123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
# Las tablas de auditoría de impresión (impresionsticker / impresionstickerdetalle) se crean
# desde proyecto_final/servicio_sincronizacion/database/database_schema.py. Si se quiere que
# Hibernate las cree automáticamente en entornos nuevos, cambiar a "update".
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}

logging.level.com.allcenter.modulebiesse=INFO

# Endpoint para validar token y obtener empleado autenticado en module-employee.
app.auth.me-endpoint=${APP_AUTH_ME_ENDPOINT:http://localhost:8080/api/auth/me}

# Origenes permitidos para CORS (separados por coma).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Eureka & Prometheus
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka/}
spring.cloud.discovery.enabled=${DISCOVERY_ENABLED:true}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
