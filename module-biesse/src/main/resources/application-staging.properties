server.forward-headers-strategy=framework

spring.jpa.hibernate.ddl-auto=${BIESSE_JPA_DDL_AUTO:${JPA_DDL_AUTO:update}}

spring.datasource.url=${BIESSE_DATASOURCE_URL}
spring.datasource.username=${BIESSE_DATASOURCE_USERNAME}
spring.datasource.password=${BIESSE_DATASOURCE_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.security.api-auth-enabled=true
app.security.headers-enabled=true
app.security.validate-secrets-on-startup=true

jwt.secret=${JWT_SECRET}

management.endpoints.web.exposure.include=health,info,prometheus
